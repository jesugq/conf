# startup
set -g base-index 1
set -g prefix C-Space
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g mouse on

# leader
bind 'C-Space' 'send-prefix'
bind ',' 'source-file ~/.tmux.conf'
bind '<' 'run ~/.tmux/plugins/tpm/bin/install_plugins'

# linux support
unbind 'C-Enter'
bind-key -n 'C-PageUp' 'previous-window'
bind-key -n 'C-PageDown' 'next-window'

# macos support
bind-key -n 'M-{' 'previous-window'
bind-key -n 'M-}' 'next-window'

# windows
bind 'r' command-prompt "rename-window '%%'"
bind-key '[' 'swap-window -d -t -1'
bind-key ']' 'swap-window -d -t +1'
bind 'X' confirm-before -p "kill-window #W? (y/n)" 'kill-window'
bind 'v' 'split-window -h'
bind 's' 'split-window -v'

# panes
bind "'" "send-keys 'C-l'"
bind 'h' "swap-pane -s '{left-of}'"
bind 'j' "swap-pane -s '{down-of}'"
bind 'k' "swap-pane -s '{up-of}'"
bind 'l' "swap-pane -s '{right-of}'"
bind 'J' 'break-pane -a'
bind 'K' 'break-pane -b'
bind 'H' 'move-pane -t :-'
bind 'L' 'move-pane -t :+'
bind -n 'C-m' 'resize-pane -Z'
bind 'C-Space' 'select-pane -t :.+'

# layouts
bind '-' 'resize-pane -x 75% -y 75%'
bind '=' 'select-layout -E'

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @oasis_flavor 'moonlight_dark'

run '~/.tmux/plugins/tpm/tpm'

# colors
set -g pane-active-border-style "fg=#66023c"
set -g pane-border-style "fg=#33011e"

# nvim-tmux-navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' 'select-pane -R'

# finish
display-message "TMUX config reloaded."
