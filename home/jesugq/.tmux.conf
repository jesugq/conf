# startup
set -s extended-keys on
set -s extended-keys-format csi-u
set -g focus-events on
set -g mouse on
setw -g mode-keys vi

# leader
set -g prefix C-Space
bind 'C-Space' 'send-prefix'
bind ',' 'source-file ~/.tmux.conf'
bind '<' 'run ~/.tmux/plugins/tpm/bin/install_plugins'

# yazi support
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# popup support
set -g popup-style "bg=#1a1b26,fg=#c0caf5"
set -g popup-border-style "bg=#1a1b26,fg=#7aa2f7"
set -s set-clipboard on
set -g allow-passthrough on

# linux support
unbind 'C-Enter'
bind-key -n 'C-PageUp' 'previous-window'
bind-key -n 'C-PageDown' 'next-window'

# macos support
bind-key -n 'M-[' 'previous-window'
# bind-key -n 'M-]' 'next-window'
bind-key -n 'M-{' 'previous-window'
bind-key -n 'M-}' 'next-window'

# sessions
bind 'q' 'choose-tree -s'
bind 'R' command-prompt "rename-session '%%'"

# windows
set-option -g renumber-windows on
bind-key '[' 'swap-window -d -t -1'
bind-key ']' 'swap-window -d -t +1'
bind c new-window -a
bind a new-window -a '$HOME/.script/afk'
bind x if-shell -F '#{m/r:(sh|bash|zsh|drift(_(linux|darwin))?|driftsh),#{pane_current_command}}' \
    'kill-pane' \
    'confirm-before -p "kill-pane #P? (y/n)" "kill-pane"'
bind 'X' confirm-before -p "kill-window #W? (y/n)" 'kill-window'
bind 'r' command-prompt "rename-window '%%'"
bind-key -n C-b if-shell -F '#{m:*-s,#{session_name}}' \
  'detach-client' \
  'display-popup -E -b rounded -s "bg=#1a1b26,fg=#c0caf5" -S "fg=#7aa2f7,bg=#1a1b26" -w 90% -h 90% "TMUX= tmux new-session -A -s \"$(tmux display-message -p '\''#{session_name}'\'')-s\""'
bind-key -T copy-mode-vi C-b if-shell -F '#{m:*-s,#{session_name}}' \
  'detach-client' \
  'display-popup -E -b rounded -s "bg=#1a1b26,fg=#c0caf5" -S "fg=#7aa2f7,bg=#1a1b26" -w 90% -h 90% "TMUX= tmux new-session -A -s \"$(tmux display-message -p '\''#{session_name}'\'')-s\""'

# panes
set -g base-index 1
setw -g pane-base-index 1
bind 'v' 'split-window -h'
bind 's' 'split-window -v'
bind 'h' "swap-pane -s '{left-of}'"
bind 'j' "swap-pane -s '{down-of}'"
bind 'k' "swap-pane -s '{up-of}'"
bind 'l' "swap-pane -s '{right-of}'"
bind 'J' 'break-pane -a'
bind 'K' 'break-pane -b'
bind 'H' 'move-pane -t :-'
bind 'L' 'move-pane -t :+'
bind -n 'C-m' 'resize-pane -Z'
bind -n 'C-n' "send-keys 'C-l'"
bind -n 'C-f' 'copy-mode'
bind-key -T copy-mode-vi C-f send-keys -X cancel
bind 'C-Space' 'select-pane -t :.+'

# layouts
bind '=' 'select-layout -E'

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @oasis_flavor 'moonlight_dark'
run '~/.tmux/plugins/tpm/tpm'
set -g pane-active-border-style "fg=#7aa2f7,bg=#1a1b26"

# nvim-tmux-navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# yazi-tmux-sequencing
is_yazi="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?yazi$'"
bind-key -n 'M-[' if-shell "$is_yazi" 'send-keys M-[' 'next-window'

# finish
display-message "TMUX config reloaded."
