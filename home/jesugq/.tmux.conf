# startup
set -s extended-keys on
set -s extended-keys-format csi-u
set -g focus-events on
set -g mouse on
setw -g mode-keys vi

# leader
set -g prefix C-Space
bind 'C-Space' 'send-prefix'
bind ',' 'source-file ~/.tmux.conf'
bind '<' 'run ~/.tmux/plugins/tpm/bin/install_plugins'

# yazi support
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# popup support
set -s set-clipboard on
set -g allow-passthrough on

# linux support
unbind 'C-Enter'
bind-key -n 'C-PageUp' 'previous-window'
bind-key -n 'C-PageDown' 'next-window'

# macos support
bind-key -n 'M-[' 'previous-window'
# bind-key -n 'M-]' 'next-window'
bind-key -n 'M-{' 'previous-window'
bind-key -n 'M-}' 'next-window'

# sessions
bind 'q' 'choose-tree -s'
bind 'R' command-prompt "rename-session '%%'"

# windows
set-option -g renumber-windows on
bind-key '[' 'swap-window -d -t -1'
bind-key ']' 'swap-window -d -t +1'
bind c new-window -a
bind a new-window -a '$HOME/.script/afk'
bind x if-shell -F '#{m/r:(sh|bash|zsh|drift(_(linux|darwin))?|driftsh),#{pane_current_command}}' \
    'kill-pane' \
    'confirm-before -p "kill-pane #P? (y/n)" "kill-pane"'
bind 'X' confirm-before -p "kill-window #W? (y/n)" 'kill-window'
bind 'r' command-prompt "rename-window '%%'"
bind 'R' command-prompt "rename-session '%%'"
bind-key -n C-b if-shell -F '#{==:#{session_name},jesugq}' \
  'detach-client' \
  'display-popup -E -b rounded -w 100% -h 100% "TMUX= tmux new-session -A -s jesugq"'
bind-key -T copy-mode-vi C-b if-shell -F '#{==:#{session_name},jesugq}' \
  'detach-client' \
  'display-popup -E -b rounded -w 100% -h 100% "TMUX= tmux new-session -A -s jesugq"'

# panes
set -g base-index 1
setw -g pane-base-index 1
bind 'v' 'split-window -h -Z'
bind 's' 'split-window -v -Z'
bind 'h' "swap-pane -s '{left-of}'"
bind 'j' "swap-pane -s '{down-of}'"
bind 'k' "swap-pane -s '{up-of}'"
bind 'l' "swap-pane -s '{right-of}'"
bind 'J' 'break-pane -a'
bind 'K' 'break-pane -b'
bind 'H' 'move-pane -t :-'
bind 'L' 'move-pane -t :+'
bind -n 'C-m' 'resize-pane -Z'
bind -n 'C-n' "send-keys 'C-l'"
bind 'C-Space' 'select-pane -t :.+ -Z'

# layouts
bind '-' 'resize-pane -y 25%'
bind '=' 'select-layout -E'

# copy mode
bind -n C-f copy-mode
bind-key -T copy-mode-vi C-f send-keys -X cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @oasis_flavor 'mirage'
set -g status-position top
run '~/.tmux/plugins/tpm/tpm'

# tmux-yank support
bind-key -T copy-mode-vi v send-keys -X begin-selection

# yazi-tmux-sequencing
is_yazi="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?yazi$'"
bind-key -n 'M-[' if-shell "$is_yazi" 'send-keys M-[' 'next-window'

# finish
display-message "TMUX config reloaded."
